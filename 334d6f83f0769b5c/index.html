*{box-sizing:border-box}

h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}

.count{font-size:13px;color:var(--mute);margin-bottom:8px}
.row{display:grid;grid-template-columns:88px 1fr 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.date{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
.chip{display:inline-block;background:var(--chip);border-radius:4px;padding:0 6px;font-size:12px;color:var(--mute);margin-top:4px}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.t{font-weight:600}
.src .ch{font-size:13px;color:var(--acc);font-weight:600}
.src .meta{font-size:12px;color:var(--mute);margin-top:2px}
.dl{display:flex;gap:6px;align-items:center;margin-top:6px}
.dl a{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--acc);word-break:break-all}
.dl button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:5px;font-size:11px;padding:1px 6px;cursor:pointer}
.none{color:var(--miss);font-size:13px}
.trk{font-size:12px;margin-top:6px;padding:3px 8px;border-radius:5px;display:inline-block}
.trk.in{background:#e4f0e1;color:#2f6b2a}.trk.out{background:#fbecd2;color:#8a5a12}.trk.no{background:var(--chip);color:var(--mute)}
@media (prefers-color-scheme:dark){.trk.in{background:#24361f;color:#9fd394}.trk.out{background:#3d2f17;color:#e9bd6f}}
.note{font-size:12px;color:var(--mute);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;color:var(--mute);font:inherit;font-size:15px;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.ct{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.ct th,.ct td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.ct th{font-size:12px;color:var(--mute);font-weight:600}
.ct .n{text-align:right;font-variant-numeric:tabular-nums}
.ct td.d{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
.ct td.note{font-size:12px;color:var(--mute)}
.ct th.s{cursor:pointer;user-select:none}.ct th.s:hover,.ct th.s.on{color:var(--acc)}.ct th.s.on::after{content:" ↓"}
.by{font-size:11px;color:var(--mute);background:var(--chip);border-radius:4px;padding:0 5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.st span{font-size:12px;color:var(--mute)}
.new{color:#8a5a12;background:#fbecd2;border-radius:4px;padding:0 5px;font-size:11px;margin-left:6px}
@media (max-width:720px){.row{grid-template-columns:1fr;gap:6px}.ct th:nth-child(5),.ct td:nth-child(5),.ct th:nth-child(6),.ct td:nth-child(6){display:none}}
