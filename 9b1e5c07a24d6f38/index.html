a{color:inherit;text-decoration:none}

.dl{display:flex;gap:6px;align-items:center;margin-top:6px}
.dl a{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--acc);word-break:break-all}
.dl button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:5px;font-size:11px;padding:1px 6px;cursor:pointer}

.trk.in{background:#e4f0e1;color:#2f6b2a}.trk.out{background:#fbecd2;color:#8a5a12}.trk.no{background:var(--chip);color:var(--mute)}

.note{font-size:12px;color:var(--mute);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;color:var(--mute);font:inherit;font-size:15px;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.ct{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.ct th,.ct td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.ct th{font-size:12px;color:var(--mute);font-weight:600}
.ct .n{text-align:right;font-variant-numeric:tabular-nums}
.ct td.d{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
.ct td.note{font-size:12px;color:var(--mute)}
.new{color:#8a5a12;background:#fbecd2;border-radius:4px;padding:0 5px;font-size:11px;margin-left:6px}
@media (max-width:720px){.row{grid-template-columns:1fr;gap:6px}.ct th:nth-child(4),.ct td:nth-child(4),.ct th:nth-child(5),.ct td:nth-child(5){display:none}}
