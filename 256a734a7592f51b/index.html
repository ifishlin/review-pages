<h1>星艦示意圖・生圖模型對照</h1>
<p class="lede">T29 那支片的 52 張示意圖，同一句描述、同一個畫風要求、同樣 1024×576，換 7 個模型各生一次。每一列點你覺得最好的那一張，上面會統計每個模型被選了幾次（只存在你這個瀏覽器）。右上角 ⤢ 放大看。秒數是 Mac Studio 上實測的每張平均，ERNIE、Qwen-Image 2512 生圖時剛好有評比在搶 GPU，會偏慢；除了 klein 4B、Z-Image，其他都是 8-bit 壓縮版。</p>

mpty stage floor is lit only by the spill from the screen."}, {"key": "994ce5b380d2", "scene": "8", "what": "一艘極巨大的銀色火星太空船直立在發射台上，底部那截推進器排滿密密麻麻的引擎噴口，旁邊的人小得像螞蟻", "prompt": "A colossal silver Mars spaceship standing upright on a launch pad, seen from ground level looking up along its towering metallic body. The lower booster section is packed with dozens of circular engine nozzles arranged in dense, neat concentric rings across its wide base. Thin support structures of the launch tower rise alongside it. At the foot of the rocket, a handful of human figures stand tiny as ants, dwarfed by the sheer scale of the machine above them. Pale overcast sky behind, smooth metallic grey hull catching soft daylight."}, {"key": "23f07495b1d4", "scene": "9", "what": "畫面並排四樣東西：一截巨大推進器、一艘太空船、一艘加油船，和一座蓋在紅色火星地表上的燃料工廠", "prompt": "A wide side-by-side lineup of four objects against a plain pale sky, shown in profile at equal scale. On the left, a single colossal metallic-grey booster stage, a tall cylindrical rocket section with a dense cluster of circular engine nozzles across its base. Next to it stands a sleek silver spaceship with a smooth pointed nose and slender metallic hull. Beside that floats a bulkier tanker craft of the same silver metal, its body rounded and fuel-heavy. On the far right, a low industrial fuel-production plant built on rust-red Martian ground, with squat tanks, pipes and towers under a dusty orange sky."}, {"key": "19efb422850a", "scene": "10", "what": "地球上方的軌道上，一艘太空船張著空油箱，另一艘加油船靠過來對接輸送燃料，地球弧線在下方", "prompt": "In orbit high above Earth, a sleek silver spaceship with a smooth pointed nose and slender metallic hull floats with its empty fuel tank open; a bulkier silver tanker craft of the same metal drifts in close alongside and connects to it, a slim fuel transfer line linking the two hulls as propellant flows across. Below them curves the bright blue arc of the Earth, the thin glowing band of the atmosphere along its edge and the deep black of space scattered with distant stars above."}, {"key": "fbe0b141c652", "scene": "13", "what": "一艘銀色的大火箭船，旁邊擺著上一版更高大的輪廓作對照，顯得縮小了一號", "prompt": "A colossal silver spaceship standing upright on a launch pad in profile, its smooth metallic-grey hull and pointed nose catching soft daylight, a dense cluster of circular engine nozzles across its base. Directly beside it, drawn as a faint grey outline against the pale overcast sky, looms the ghosted silhouette of an even taller and wider earlier rocket of the same shape, towering noticeably above the solid silver ship so the new one looks shrunken by comparison. A few tiny human figures stand at the foot of the pad, dwarfed by both."}, {"key": "030ec4007685", "scene": "14", "what": "一支火箭沿地球弧線的拋物線飛行，一端是一座城市的天際線，另一端是另一座城市，下方是藍色地球", "prompt": "A sleek silver rocket with a smooth pointed nose and slender metallic hull, seen in profile, arcing along a long curved parabolic path high above the bright blue curve of the Earth. At one end of the arc, near the horizon, rises the clustered skyline of a dense coastal city of tall towers; at the far other end of the arc stands a second distant city skyline. Below the whole flight path curves the blue planet, a thin glowing band of atmosphere along its edge and the deep black of space scattered with faint stars above."}, {"key": "a38ac3dc9c90", "scene": "15", "what": "一艘太空船沿弧線繞過巨大的月球背面，遠處是星空與地球", "prompt": "A sleek silver spaceship with a smooth pointed nose and slender metallic hull, seen in profile, arcing along a long curved path around the far side of an enormous grey moon, its cratered surface filling much of the frame. The ship glides just above the lunar horizon, following a gentle curve across the airless dark. Far in the distance hangs the small bright blue marble of the Earth, a thin glowing band of atmosphere along its edge, set against the deep black of space scattered with countless faint stars."}, {"key": "3d13bc215199", "scene": "16", "what": "三艘一代比一代矮小的火箭船並排對照，最右邊那艘明顯最小", "prompt": "A side-by-side lineup of three silver rocket ships in profile against a plain pale sky, each one shorter and smaller than the one before it, shown at equal distance so the shrinking scale is clear. On the left stands the tallest ship, a sleek metallic-grey hull with a smooth pointed nose and a dense cluster of circular engine nozzles across its base. In the middle, a noticeably shorter version of the same silver ship. On the far right, the smallest and stubbiest of the three, its slender body clearly dwarfed by the others, with the same pointed nose and engine nozzles."}, {"key": "c8ce721b3c13", "scene": "17", "what": "一艘紅白格子、圓頭尖身、像老漫畫裡的復古火箭，矗立在地上", "prompt": "A retro cartoon-style rocket standing upright on flat open ground, seen in profile at ground level. Its tall body is painted in a bold red-and-white checkered pattern, with a smooth rounded dome at the top tapering into a pointed nose and three curved fins splaying out at its base where it rests on the earth. The hull is clean and glossy like an old comic-book illustration. A plain pale sky stretches behind it, and a few tiny human figures stand nearby, dwarfed by the toy-like rocket towering above them."}, {"key": "cffa84160ac1", "scene": "19", "what": "三艘不同造型的火箭船一排立在地上都沒升空，遠方天上一艘船正要替另一艘加油", "prompt": "Three differently-shaped rocket ships stand in a row on flat open ground, none of them launched, seen side by side in profile against a pale overcast sky. On the left a tall slender silver ship with a smooth pointed nose and a dense cluster of engine nozzles; in the middle a stockier metallic-grey rocket; on the right a bulkier rounded craft, each resting on the earth. Far away in the sky above them, one small silver spaceship drifts close alongside another, a slim fuel transfer line linking their hulls as propellant flows between them."}, {"key": "d7c9b84692b1", "scene": "20", "what": "一台快完成的碳纖維展示火箭,整個方案說丟就丟", "prompt": "A tall nearly-finished rocket with a smooth pointed nose and slender hull made of dark glossy carbon-fiber, its surface showing the fine woven black weave, standing upright on open ground seen in profile. The ship is only half-built, its lower section still open with scaffolding around it. Beside it, discarded curved panels of the same black carbon material lie abandoned on the earth, tipped over and left behind. A few tiny human figures walk away from the towering machine under a pale overcast sky."}, {"key": "3552237d2e43", "scene": "22", "what": "一艘太空船從太空返回,衝進大氣層,整個銀色船身燒得通紅發亮,像一顆拖著火尾的流星", "prompt": "A sleek silver spaceship with a smooth pointed nose and slender metallic hull, seen in profile, plunging steeply down through the upper atmosphere as it returns from space. Its entire hull glows searing orange and white-hot like a burning meteor, a long trail of fire and glowing sparks streaming behind its tail across the sky. Below curves the bright blue arc of the Earth with a thin glowing band of atmosphere along its edge, the deep black of space scattered with faint stars above the falling ship."}, {"key": "8d6d01cab9e1", "scene": "24", "what": "一座矮胖的銀色試驗火箭立在空地上,頂端平平沒有鼻錐,只有粗粗的支腳,遠看活像一座大水塔", "prompt": "A short, squat silver test rocket standing upright on flat open ground, seen in profile at ground level. Its stocky cylindrical metallic-grey body has a completely flat top with no pointed nose cone, and it rests on a few thick sturdy landing legs splayed out at its base. The stubby machine looks much like a large industrial water tower, its smooth metal hull catching soft daylight. A few tiny human figures stand nearby on the bare ground, dwarfed by it, under a pale overcast sky."}, {"key": "107944c0eb91", "scene": "25", "what": "一座矮胖的銀色試驗火箭被強風吹得傾倒歪在地上,旁邊幾個工人圍過去要把它扶起來重新立好", "prompt": "A short, squat silver test rocket, its stocky cylindrical metallic-grey body with a completely flat top and no pointed nose cone, lying toppled and tilted over at a steep angle across flat open ground after being knocked down by strong wind, resting partly on its thick sturdy landing legs now splayed sideways. Several human workers in work clothes crowd in close around the fallen machine, reaching up with their arms and leaning in together to heave the stubby rocket upright again. Loose dust blows across the bare earth under a pale grey overcast sky."}, {"key": "79dba858651d", "scene": "31", "what": "那座像水塔的試驗機被拆解,只剩底部結構,改裝成一座外型怪異的引擎測試架立在場地上", "prompt": "A short, squat silver test rocket partly dismantled on flat open ground, seen in profile at ground level, with its stocky cylindrical metallic-grey upper body cut away and removed so only the lower base structure and the thick sturdy splayed landing legs remain. The leftover bottom section has been crudely rebuilt into an odd, boxy engine test stand bristling with pipes, brackets and a mounting frame holding a single engine at its center. Scattered removed metal panels lie on the bare earth nearby under a pale grey overcast sky."}, {"key": "42225b0ab2fb", "scene": "34", "what": "一個又矮又胖的銀色金屬圓筒火箭原型，外型像放大的啤酒罐或會飛的穀倉，頂端只有一個簡單圓罩，孤零零立在德州平坦乾燥的試驗場上，沒有尖頭火箭的流線感", "prompt": "A short, squat silver test rocket prototype standing alone upright on a flat, dry, barren Texas test site, seen in profile at ground level. Its wide, stubby cylindrical metallic-grey body looks like a scaled-up beer can or a flying grain silo, topped with only a simple rounded dome cap and no pointed nose cone. The hull is smooth and catches soft daylight, resting on thick sturdy landing legs on the bare cracked earth. A plain pale overcast sky stretches behind it, the squat machine completely lacking the streamlined look of a tall pointed rocket."}, {"key": "6d6e8fe5be4d", "scene": "43", "what": "一個穿未來動力裝甲、面罩遮住臉的士兵在滿是外星兵器的戰場上倒下、又回到同一刻重新站起，用環形重複的構圖表現他一次次重來、一次比一次往前多推進一點", "prompt": "A lone soldier in sleek futuristic powered armor, his face fully hidden behind a smooth visored helmet, caught mid-motion in a circular ring of repeated figures across a smoking alien battlefield. At the bottom of the ring he lies fallen in the dirt among const LIC = { ok: "可商用", pay: "要付費授權", no: "商用可能買不到" };
let picks = {}, hidden = {};
try { picks = JSON.parse(localStorage.getItem("imgcmp-picks") || "{}") } catch (e) {}
try { hidden = JSON.parse(localStorage.getItem("imgcmp-hidden") || "{}") } catch (e) {}
const save = () => { try { localStorage.setItem("imgcmp-picks", JSON.stringify(picks)); localStorage.setItem("imgcmp-hidden", JSON.stringify(hidden)) } catch (e) {} };

function renderModels() {
  const counts = {};
  Object.values(picks).forEach(m => counts[m] = (counts[m] || 0) + 1);
  const box = document.getElementById("models");
  box.innerHTML = "";
  DATA.models.forEach(m => {
    const b = document.createElement("button");
    b.className = "model"; b.type = "button"; b.setAttribute("aria-pressed", hidden[m.id] ? "false" : "true");
    b.title = "點一下：顯示／隱藏這個模型";
    b.innerHTML = `<span class="mname">${m.name}</span>
      <span class="lic ${m.commercial}">${LIC[m.commercial]}・${m.license}</span>
      <span class="meta">${m.sec ? m.sec + " 秒／張" : ""}${m.note ? "・" + m.note : ""}</span>
      <span class="votes">${counts[m.id] || 0}<span class="meta"> 次被選</span></span>`;
    b.onclick = () => { hidden[m.id] = !hidden[m.id]; save(); renderAll() };
    box.appendChild(b);
  });
  document.getElementById("progress").textContent = `已經選了 ${Object.keys(picks).length}／${DATA.rows.length} 列`;
}

function renderRows() {

    // 盲選時每一列的順序也打亂（照列和模型算一個固定的雜湊），不然看位置就知道是誰
    const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
    const shown = DATA.models.filter(m => !hidden[m.id]);
    if (document.body.classList.contains("blind")) shown.sort((a, b) => hash(r.key + a.id) - hash(r.key + b.id));
    shown.forEach(m => {
      const t = document.createElement("div");
      t.className = "tile"; t.tabIndex = 0; t.setAttribute("role", "button");
      t.setAttribute("aria-pressed", picks[r.key] === m.id ? "true" : "false");
      const idx = DATA.models.findIndex(x => x.id === m.id), n = DATA.models.length;
      const pos = `${idx / (n - 1) * 100}% 0`;
      t.innerHTML = `<div class="pic" role="img" aria-label="${m.name}：${r.what}"
          style="background-image:url('rows/${r.key}.jpg');background-size:${n * 100}% 100%;background-position:${pos}"></div>
        <span class="cap"><span class="mn">${m.name}</span><b>${picks[r.key] === m.id ? "★ 選這張" : ""}</b></span>`;
      const z = document.createElement("button"); z.className = "zoom"; z.type = "button"; z.textContent = "⤢";
      z.onclick = e => { e.stopPropagation(); openBig(r.key, n, pos, m.name, r) };
      t.appendChild(z);
      const choose = () => { if (picks[r.key] === m.id) delete picks[r.key]; else picks[r.key] = m.id; save(); renderAll() };
      t.onclick = choose;
      t.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose() } };
      tiles.appendChild(t);
    });
    main.appendChild(row);
  });
}

function openBig(key, n, pos, name, r) {
  const b = document.getElementById("bigimg");
  b.style.backgroundImage = `url('rows/${key}.jpg')`; b.style.backgroundSize = `${n * 100}% 100%`; b.style.backgroundPosition = pos;
  document.getElementById("bigcap").textContent = (document.body.classList.contains("blind") ? "" : name + "・") + "景 " + r.scene + "：" + r.what;
  const d = document.getElementById("big"); d.showModal();
  d.onclick = () => d.close();
}

function renderAll() { const y = window.scrollY; renderModels(); renderRows(); window.scrollTo(0, y) }
document.getElementById("blind").onclick = e => {
  document.body.classList.toggle("blind");
  e.target.textContent = document.body.classList.contains("blind") ? "顯示模型名稱" : "隱藏模型名稱（盲選）";
  renderAll();
};
document.getElementById("reset").onclick = () => { picks = {}; save(); renderAll() };
renderAll();
</script>
